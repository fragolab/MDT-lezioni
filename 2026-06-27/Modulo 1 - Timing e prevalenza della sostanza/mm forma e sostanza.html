ermini di decadenza e COVID-19","children":[],"payload":{"tag":"li","lines":"42,43"}}],"payload":{"tag":"h3","lines":"41,42"}},{"content":"&#x1f4cd; Fatti","children":[{"content":"71 fatture pre-registrazione (2017-2019)","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"Diritto bulgaro: 12 mesi dalla registrazione per la detrazione pregressa (scadenza nov. 2020)","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"Inserite in ritardo (dic. 2020): motivo, quarantena COVID del contabile","children":[],"payload":{"tag":"li","lines":"46,47"}}],"payload":{"tag":"h3","lines":"43,44"}},{"content":"&#x2753; Questione","children":[{"content":"I termini di decadenza IVA sono derogabili in base alle proroghe COVID concesse ad altre imposte? (equivalenza / effettivit&#xe0;)","children":[],"payload":{"tag":"li","lines":"48,49"}}],"payload":{"tag":"h3","lines":"47,48"}},{"content":"&#x2696;&#xfe0f; Soluzione (Corte UE)","children":[{"content":"<strong>Equivalenza:</strong> imposte dirette e IVA hanno natura diversa &#x2192; nessuna violazione","children":[],"payload":{"tag":"li","lines":"50,51"}},{"content":"<strong>Effettivit&#xe0;:</strong> 12 mesi non rendono eccessivamente difficile; la malattia copriva solo <strong>due settimane</strong> su dodici mesi","children":[],"payload":{"tag":"li","lines":"51,52"}},{"content":"<strong>Rettifica:</strong> non serve a far risorgere un diritto perso per decadenza","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"<strong>Principio:</strong> termini di decadenza ragionevoli legittimi","children":[],"payload":{"tag":"li","lines":"53,55"}}],"payload":{"tag":"h3","lines":"49,50"}}],"payload":{"tag":"h2","lines":"40,41"}},{"content":"4. Barlis 06 &#x2014; C-516/14 (2016)","children":[{"content":"&#x1f3af; Tema","children":[{"content":"Sufficienza delle descrizioni in fattura","children":[],"payload":{"tag":"li","lines":"57,58"}}],"payload":{"tag":"h3","lines":"56,57"}},{"content":"&#x1f4cd; Fatti","children":[{"content":"Fatture di uno studio legale con diciture generiche (&#xab;servizi giuridici resi fino ad oggi&#xbb;)","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"Il Fisco nega per indeterminatezza; ignora i documenti integrativi offerti","children":[],"payload":{"tag":"li","lines":"60,61"}}],"payload":{"tag":"h3","lines":"58,59"}},{"content":"&#x2753; Questione","children":[{"content":"Le descrizioni generiche invalidano la fattura? Il Fisco pu&#xf2; ignorare i documenti integrativi?","children":[],"payload":{"tag":"li","lines":"62,63"}}],"payload":{"tag":"h3","lines":"61,62"}},{"content":"&#x2696;&#xfe0f; Soluzione (Corte UE)","children":[{"content":"<strong>Forma:</strong> le diciture generiche non soddisfano <em>a priori</em> l&apos;art. 226 (natura, entit&#xe0;, data)","children":[],"payload":{"tag":"li","lines":"64,65"}},{"content":"<strong>Sostanza:</strong> la neutralit&#xe0; esige la detrazione se i requisiti sostanziali sono soddisfatti","children":[],"payload":{"tag":"li","lines":"65,66"}},{"content":"<strong>Dovere del Fisco:</strong> non pu&#xf2; fermarsi alla fattura, deve valutare le informazioni complementari","children":[],"payload":{"tag":"li","lines":"66,67"}},{"content":"<strong>Principio:</strong> conta la verifica sostanziale","children":[],"payload":{"tag":"li","lines":"67,69"}}],"payload":{"tag":"h3","lines":"63,64"}}],"payload":{"tag":"h2","lines":"55,56"}},{"content":"5. Senatex &#x2014; C-518/14 (2016)","children":[{"content":"&#x1f3af; Tema","children":[{"content":"Efficacia retroattiva della rettifica (<em>ex tunc</em> / <em>ex nunc</em>)","children":[],"payload":{"tag":"li","lines":"71,72"}}],"payload":{"tag":"h3","lines":"70,71"}},{"content":"&#x1f4cd; Fatti","children":[{"content":"Detrazione su documenti privi del numero IVA del destinatario","children":[],"payload":{"tag":"li","lines":"73,74"}},{"content":"Vizio sanato in verifica (anni dopo)","children":[],"payload":{"tag":"li","lines":"74,75"}},{"content":"Il Fisco colloca la detrazione all&apos;anno della rettifica (<em>ex nunc</em>) + interessi di mora","children":[],"payload":{"tag":"li","lines":"75,76"}}],"payload":{"tag":"h3","lines":"72,73"}},{"content":"&#x2753; Questione","children":[{"content":"La rettifica del vizio formale ha effetto retroattivo all&apos;anno in cui il diritto &#xe8; sorto?","children":[],"payload":{"tag":"li","lines":"77,78"}}],"payload":{"tag":"h3","lines":"76,77"}},{"content":"&#x2696;&#xfe0f; Soluzione (Corte UE)","children":[{"content":"<strong>Forma vs sostanza:</strong> il possesso della fattura completa &#xe8; condizione <em>formale</em>","children":[],"payload":{"tag":"li","lines":"79,80"}},{"content":"<strong>Neutralit&#xe0;:</strong> posporre la detrazione + interessi impone un onere ingiustificato","children":[],"payload":{"tag":"li","lines":"80,81"}},{"content":"<strong>Retroattivit&#xe0;:</strong> la rettifica opera <em>ex tunc</em>","children":[],"payload":{"tag":"li","lines":"81,82"}},{"content":"<strong>Principio:</strong> rettifica retroattiva","children":[],"payload":{"tag":"li","lines":"82,84"}}],"payload":{"tag":"h3","lines":"78,79"}}],"payload":{"tag":"h2","lines":"69,70"}},{"content":"6. Volkswagen &#x2014; C-533/16 (2018)","children":[{"content":"&#x1f3af; Tema","children":[{"content":"Impossibilit&#xe0; oggettiva e <em>dies a quo</em> della decadenza","children":[],"payload":{"tag":"li","lines":"86,87"}}],"payload":{"tag":"h3","lines":"85,86"}},{"content":"&#x1f4cd; Fatti","children":[{"content":"Hella fattura senza IVA (2004-2010) credendo le operazioni esenti","children":[],"payload":{"tag":"li","lines":"88,89"}},{"content":"Nel 2010 corregge, emette fatture con IVA e la versa","children":[],"payload":{"tag":"li","lines":"89,90"}},{"content":"VW chiede il rimborso (2011); il Fisco slovacco eccepisce la decadenza quinquennale dalla cessione (2004-2006)","children":[],"payload":{"tag":"li","lines":"90,91"}}],"payload":{"tag":"h3","lines":"87,88"}},{"content":"&#x2753; Questione","children":[{"content":"Il termine pu&#xf2; decorrere prima che l&apos;acquirente possieda la fattura e conosca l&apos;imposta?","children":[],"payload":{"tag":"li","lines":"92,93"}}],"payload":{"tag":"h3","lines":"91,92"}},{"content":"&#x2696;&#xfe0f; Soluzione (Corte UE)","children":[{"content":"<strong>Impossibilit&#xe0; oggettiva:</strong> fino al 2010 VW non poteva esercitare il diritto","children":[],"payload":{"tag":"li","lines":"94,95"}},{"content":"<strong>Dies a quo:</strong> un termine che spira prima della regolarizzazione rende eccessivamente difficile la detrazione","children":[],"payload":{"tag":"li","lines":"95,96"}},{"content":"<strong>Takeaway:</strong> decadenza opponibile solo in caso di negligenza, non di regolarizzazione in buona fede","children":[],"payload":{"tag":"li","lines":"96,97"}},{"content":"<strong>Principio:</strong> il <em>dies a quo</em> non precede l&apos;esercitabilit&#xe0;","children":[],"payload":{"tag":"li","lines":"97,99"}}],"payload":{"tag":"h3","lines":"93,94"}}],"payload":{"tag":"h2","lines":"84,85"}},{"content":"7. Idexx Laboratories Italia &#x2014; C-590/13 (2014)","children":[{"content":"&#x1f3af; Tema","children":[{"content":"Violazioni formali nel reverse charge","children":[],"payload":{"tag":"li","lines":"101,102"}}],"payload":{"tag":"h3","lines":"100,101"}},{"content":"&#x1f4cd; Fatti","children":[{"content":"Acquisti intracomunitari non annotati regolarmente o registrati come &#xab;fuori campo IVA&#xbb;","children":[],"payload":{"tag":"li","lines":"103,104"}},{"content":"L&apos;Agenzia delle Entrate: violazione sostanziale + sanzione 100%","children":[],"payload":{"tag":"li","lines":"104,105"}}],"payload":{"tag":"h3","lines":"102,103"}},{"content":"&#x2753; Questione","children":[{"content":"Gli obblighi di registrazione nel reverse charge sono formali o sostanziali?","children":[],"payload":{"tag":"li","lines":"106,107"}}],"payload":{"tag":"h3","lines":"105,106"}},{"content":"&#x2696;&#xfe0f; Soluzione (Corte UE)","children":[{"content":"<strong>Natura:</strong> contabilit&#xe0; e registrazione sono obblighi <em>formali</em>","children":[],"payload":{"tag":"li","lines":"108,109"}},{"content":"<strong>Autoliquidazione:</strong> nessun versamento tra le parti (debito e credito si elidono); l&apos;erario non perde nulla","children":[],"payload":{"tag":"li","lines":"109,110"}},{"content":"<strong>Conseguenza:</strong> se la sostanza &#xe8; accertabile, la detrazione resta salva","children":[],"payload":{"tag":"li","lines":"110,111"}},{"content":"<strong>Principio:</strong> formalit&#xe0; &#x2260; sostanza","children":[],"payload":{"tag":"li","lines":"111,113"}}],"payload":{"tag":"h3","lines":"107,108"}}],"payload":{"tag":"h2","lines":"99,100"}},{"content":"8. SEM Remont &#x2014; C-624/23 (2024)","children":[{"content":"&#x1f3af; Tema","children":[{"content":"Requisiti sostanziali assenti; &#xab;verbale&#xbb; al posto della fattura","children":[],"payload":{"tag":"li","lines":"115,116"}}],"payload":{"tag":"h3","lines":"114,115"}},{"content":"&#x1f4cd; Fatti","children":[{"content":"Fornitore russo non registrato fattura senza IVA (2020)","children":[],"payload":{"tag":"li","lines":"117,118"}},{"content":"Registrato retroattivamente, redige un verbale in cui figura sia come prestatore sia come destinatario","children":[],"payload":{"tag":"li","lines":"118,119"}},{"content":"L&apos;IVA non &#xe8; pagata da SEM Remont (vero destinatario: ES BILD)","children":[],"payload":{"tag":"li","lines":"119,120"}}],"payload":{"tag":"h3","lines":"116,117"}},{"content":"&#x2753; Questione","children":[{"content":"Il destinatario pu&#xf2; detrarre su un verbale interno se manca una fattura regolare con IVA assolta?","children":[],"payload":{"tag":"li","lines":"121,122"}}],"payload":{"tag":"h3","lines":"120,121"}},{"content":"&#x2696;&#xfe0f; Soluzione (Corte UE)","children":[{"content":"<strong>Requisito mancante:</strong> l&apos;IVA non era dovuta n&#xe9; assolta da SEM (non era il vero destinatario)","children":[],"payload":{"tag":"li","lines":"123,124"}},{"content":"<strong>Non &#xe8; una fattura:</strong> il verbale per il fisco non equivale a una fattura","children":[],"payload":{"tag":"li","lines":"124,125"}},{"content":"<strong>Esito:</strong> diritto a detrazione inesistente; diniego compatibile col diritto UE","children":[],"payload":{"tag":"li","lines":"125,126"}},{"content":"<strong>Principio:</strong> senza imposta dovuta/assolta e vera fattura, niente detrazione","children":[],"payload":{"tag":"li","lines":"126,128"}}],"payload":{"tag":"h3","lines":"122,123"}}],"payload":{"tag":"h2","lines":"113,114"}},{"content":"9. V&#x103;dan &#x2014; C-664/16 (2018)","children":[{"content":"&#x1f3af; Tema","children":[{"content":"Onere della prova e perizia","children":[],"payload":{"tag":"li","lines":"130,131"}}],"payload":{"tag":"h3","lines":"129,130"}},{"content":"&#x1f4cd; Fatti","children":[{"content":"Costruttore accertato come soggetto passivo; niente registrazione n&#xe9; contabilit&#xe0;, n&#xe9; fatture (solo scontrini illeggibili)","children":[],"payload":{"tag":"li","lines":"132,133"}},{"content":"Chiede di stimare l&apos;IVA detraibile con perizia giudiziaria","children":[],"payload":{"tag":"li","lines":"133,134"}}],"payload":{"tag":"h3","lines":"131,132"}},{"content":"&#x2753; Questione","children":[{"content":"La perizia basta a fondare la detrazione in assenza di fatture?","children":[],"payload":{"tag":"li","lines":"135,136"}}],"payload":{"tag":"h3","lines":"134,135"}},{"content":"&#x2696;&#xfe0f; Soluzione (Corte UE)","children":[{"content":"<strong>Onere della prova:</strong> sul contribuente, con prove oggettive dell&apos;IVA assolta a fornitori soggetti passivi","children":[],"payload":{"tag":"li","lines":"137,138"}},{"content":"<strong>Limiti della perizia:</strong> pu&#xf2; integrare, non <em>sostituire</em>, la prova documentale","children":[],"payload":{"tag":"li","lines":"138,139"}},{"content":"<strong>Principio:</strong> la sostanza va comunque provata","children":[],"payload":{"tag":"li","lines":"139,141"}}],"payload":{"tag":"h3","lines":"136,137"}}],"payload":{"tag":"h2","lines":"128,129"}},{"content":"10. Wilo Salmson France &#x2014; C-80/20 (2021)","children":[{"content":"&#x1f3af; Tema","children":[{"content":"Elusione dei termini con lo storno delle fatture","children":[],"payload":{"tag":"li","lines":"143,144"}}],"payload":{"tag":"h3","lines":"142,143"}},{"content":"&#x1f4cd; Fatti","children":[{"content":"Rimborso 2012 respinto in via definitiva","children":[],"payload":{"tag":"li","lines":"145,146"}},{"content":"Il fornitore storna e riemette fatture identiche (2015) per riaprire i termini","children":[],"payload":{"tag":"li","lines":"146,147"}},{"content":"Nuova domanda respinta (periodo d&apos;imposta superato)","children":[],"payload":{"tag":"li","lines":"147,148"}}],"payload":{"tag":"h3","lines":"144,145"}},{"content":"&#x2753; Questione","children":[{"content":"Lo storno unilaterale di una fattura annullata fa decorrere nuovamente i termini?","children":[],"payload":{"tag":"li","lines":"149,150"}}],"payload":{"tag":"h3","lines":"148,149"}},{"content":"&#x2696;&#xfe0f; Soluzione (Corte UE)","children":[{"content":"<strong>Regola:</strong> il rimborso esige il possesso della fattura; non si nega solo per esigibilit&#xe0; anteriore se la fattura &#xe8; ricevuta nel periodo","children":[],"payload":{"tag":"li","lines":"151,152"}},{"content":"<strong>Limite:</strong> storno + riemissione dopo un diniego definitivo, senza annullare l&apos;operazione, aggira la decadenza &#x2192; certezza del diritto","children":[],"payload":{"tag":"li","lines":"152,153"}},{"content":"<strong>Principio:</strong> lo storno unilaterale non riapre termini definitivi","children":[],"payload":{"tag":"li","lines":"153,155"}}],"payload":{"tag":"h3","lines":"150,151"}}],"payload":{"tag":"h2","lines":"141,142"}},{"content":"11. Biosafe &#x2014; C-8/17 (2018)","children":[{"content":"&#x1f3af; Tema","children":[{"content":"Decorrenza dei termini e &#xab;supplemento d&apos;imposta&#xbb;","children":[],"payload":{"tag":"li","lines":"157,158"}}],"payload":{"tag":"h3","lines":"156,157"}},{"content":"&#x1f4cd; Fatti","children":[{"content":"Biosafe applica l&apos;aliquota ridotta del <strong>5%</strong>; un&apos;ispezione impone l&apos;ordinaria del <strong>21%</strong>","children":[],"payload":{"tag":"li","lines":"159,160"}},{"content":"Versa il supplemento ed emette note di addebito a Flexipiso, quattro anni dopo","children":[],"payload":{"tag":"li","lines":"160,161"}},{"content":"Flexipiso rifiuta: il termine quadriennale (dalle fatture iniziali) sarebbe scaduto","children":[],"payload":{"tag":"li","lines":"161,162"}}],"payload":{"tag":"h3","lines":"158,159"}},{"content":"&#x2753; Questione","children":[{"content":"Il termine per l&apos;acquirente decorre dalle fatture originarie o dai documenti di rettifica?","children":[],"payload":{"tag":"li","lines":"163,164"}}],"payload":{"tag":"h3","lines":"162,163"}},{"content":"&#x2696;&#xfe0f; Soluzione (Corte UE)","children":[{"content":"<strong>Decorrenza:</strong> far decorrere dalle fatture iniziali priva l&apos;acquirente incolpevole della detrazione &#x2192; viola la neutralit&#xe0;","children":[],"payload":{"tag":"li","lines":"165,166"}},{"content":"<strong>Impossibilit&#xe0; oggettiva:</strong> prima dei documenti di rettifica Flexipiso non poteva esercitare il diritto","children":[],"payload":{"tag":"li","lines":"166,167"}},{"content":"<strong>Principio:</strong> coeva a <em>Volkswagen</em> (neutralit&#xe0; temporale)","children":[],"payload":{"tag":"li","lines":"167,169"}}],"payload":{"tag":"h3","lines":"164,165"}}],"payload":{"tag":"h2","lines":"155,156"}},{"content":"12. I.S.A. &#x2014; T-689/24 (Tribunale UE, 2026)","children":[{"content":"&#x1f3af; Tema","children":[{"content":"Norma polacca e posticipazione obbligata della detrazione","children":[],"payload":{"tag":"li","lines":"171,172"}}],"payload":{"tag":"h3","lines":"170,171"}},{"content":"&#x1f4cd; Fatti","children":[{"content":"I.S.A. acquista gas ed energia","children":[],"payload":{"tag":"li","lines":"173,174"}},{"content":"Riceve la fattura nel periodo d&apos;imposta successivo, ma <em>prima</em> della dichiarazione del periodo di competenza","children":[],"payload":{"tag":"li","lines":"174,175"}},{"content":"La legge polacca posticipa la detrazione al periodo di ricezione del documento","children":[],"payload":{"tag":"li","lines":"175,176"}}],"payload":{"tag":"h3","lines":"172,173"}},{"content":"&#x2753; Questione","children":[{"content":"Una norma pu&#xf2; legare la <em>nascita</em> del diritto al possesso formale della fattura?","children":[],"payload":{"tag":"li","lines":"177,178"}}],"payload":{"tag":"h3","lines":"176,177"}},{"content":"&#x2696;&#xfe0f; Soluzione (Tribunale UE)","children":[{"content":"<strong>Nascita vs esercizio:</strong> il possesso della fattura regola l&apos;<em>esercizio</em>, non la <em>nascita</em> (condizione sostanziale = esigibilit&#xe0;)","children":[],"payload":{"tag":"li","lines":"179,180"}},{"content":"<strong>Sostanza vs forma:</strong> se il contribuente ha la fattura al momento della dichiarazione, posporre la detrazione lo costringe a finanziare indebitamente l&apos;erario &#x2192; viola neutralit&#xe0; e proporzionalit&#xe0;","children":[],"payload":{"tag":"li","lines":"180,181"}},{"content":"<strong>Rilievo istituzionale:</strong> prima pronuncia pregiudiziale del Tribunale UE","children":[],"payload":{"tag":"li","lines":"181,182"}},{"content":"<strong>Principio:</strong> la forma condiziona l&apos;esercizio, non la nascita","children":[],"payload":{"tag":"li","lines":"182,183"}}],"payload":{"tag":"h3","lines":"178,179"}}],"payload":{"tag":"h2","lines":"169,170"}}],"payload":{"tag":"h1","lines":"8,9"}},{"colorFreezeLevel":2,"maxWidth":340,"initialExpandLevel":2})</script>
