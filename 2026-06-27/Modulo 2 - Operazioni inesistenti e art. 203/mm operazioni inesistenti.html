# Modulo 2 · Operazioni inesistenti e art. 203 della direttiva IVA

## 🧭 Filo conduttore
- **Cartolarità (art. 203):** chi indica l'IVA in fattura la deve, per l'intero ammontare
- **Funzione cautelare**, non sanzionatoria: presidia il rischio di perdita di gettito
- **Sistema simmetrico:** emittente (debito *rettificabile*) ↔ cessionario (diniego solo con *prova* della consapevolezza)
- Il fisco **non** incassa due volte sull'operazione inesistente

## 🟥 Versante emittente — debito da menzione e rettifica

### Genius Holding — C-342/87 (1989)
#### 📍 Fatti
- Subappaltatore edile espone in fattura un'IVA non dovuta (reverse charge); Genius la detrae; il Fisco recupera
#### ❓ Questione
- Il diritto a detrazione si estende all'imposta dovuta solo perché indicata in fattura?
#### ⚖️ Soluzione
- **No:** la detrazione non si estende all'imposta dovuta esclusivamente perché esposta in fattura
- Gli Stati devono consentire la **rettifica** per garantire la neutralità
- **Principio:** l'imposta «da cartolarità» non è detraibile

### Karageorgou — C-78/02 (2003)
#### 📍 Fatti
- Traduttori rendono servizi allo Stato greco credendosi autonomi ed esponendo l'IVA; in realtà sono subordinati (non soggetti passivi)
#### ❓ Questione
- L'importo esposto come IVA da chi non è soggetto passivo è «IVA»? È restituibile?
#### ⚖️ Soluzione
- **Non è IVA** quando i servizi non sono soggetti; l'art. 21,1,c) non osta alla **restituzione**
- L'obbligazione da cartolarità non crea nuovi soggetti passivi
- **Principio:** ciò che non è imposta non lo diventa per il solo fatto di essere fatturato

### Schmeink & Cofreth — C-454/98 (2000)
#### 📍 Fatti
- Fatture che espongono l'IVA per operazioni inesistenti (*pro forma*); gli emittenti chiedono di regolarizzare
#### ❓ Questione
- La rettifica dell'IVA indebitamente fatturata può essere subordinata alla buona fede?
#### ⚖️ Soluzione
- Se il rischio di perdita di gettito è **eliminato in tempo utile**, la rettifica spetta **senza** condizione di buona fede
- Gli Stati definiscono il procedimento, non rimesso alla discrezionalità
- **Principio:** eliminato il rischio erariale, rettifica a prescindere dalla buona fede

### Stadeco — C-566/07 (2009)
#### 📍 Fatti
- Stadeco espone l'IVA per prestazioni non imponibili nello Stato di fatturazione; chiede la regolarizzazione
#### ❓ Questione
- L'imposta esposta è dovuta anche se l'operazione non è imponibile? A quali condizioni la rettifica?
#### ⚖️ Soluzione
- L'IVA è **dovuta** nello Stato cui corrisponde quella esposta in fattura
- La neutralità non osta a subordinare la rettifica all'invio di una **fattura corretta** priva di IVA
- **Principio:** debito da menzione effettivo; rettifica condizionabile all'eliminazione del rischio

### EN.SA. — C-712/17 (2019)
#### 📍 Fatti
- Vendite **fittizie e circolari** di energia tra gli stessi operatori e per gli stessi importi, senza perdita di gettito
- La legge IT nega la detrazione, impone il versamento ex art. 203 e una sanzione del 100%
#### ❓ Questione
- La direttiva osta a negare la detrazione ed esigere il versamento? La sanzione del 100% è proporzionata?
#### ⚖️ Soluzione
- **Non osta** a negare la detrazione su operazioni fittizie ed esigere il versamento, **purché** sia possibile rettificare quando l'emittente (anche in mala fede iniziale) ha eliminato in tempo il rischio
- Sanzione del 100% **sproporzionata**
- **Principio:** cartolarità + valvola di rettifica; proporzionalità delle sanzioni

### P GmbH (Finanzamt Österreich) — C-378/21 (2022)
#### 📍 Fatti
- Parco giochi al coperto: ai clienti (soli **consumatori finali**) viene applicata l'aliquota ordinaria 20% invece della ridotta 13%, esponendo IVA in eccesso
#### ❓ Questione
- L'emittente è debitore ex art. 203 della parte di IVA fatturata in eccesso, se i destinatari non hanno diritto a detrazione?
#### ⚖️ Soluzione
- **No:** nessun debito ex art. 203 per l'eccedenza quando **non vi è rischio di perdita di gettito** (destinatari = consumatori finali senza detrazione)
- **Principio:** l'art. 203 presidia il rischio erariale; senza rischio, niente debito da menzione

### P sp. z o.o. — C-442/22 (2024)
#### 📍 Fatti
- Una **dipendente** emette per anni fatture false con IVA usando l'identità del datore di lavoro, a sua insaputa e senza consenso
#### ❓ Questione
- Chi è il «soggetto che indica l'IVA» ex art. 203: il datore (dati usurpati) o la dipendente?
#### ⚖️ Soluzione
- È la **dipendente** la persona che indica l'IVA ex art. 203, **salvo** che il datore non abbia agito con la **diligenza ragionevolmente dovuta** nel controllarne la condotta
- **Principio:** risponde chi emette la falsa fattura; il soggetto passivo diligente non risponde dell'abuso del dipendente

## 🟦 Versante cessionario — diniego e buona fede

### Mahagében e Dávid — C-80/11 e C-142/11 (2012)
#### 📍 Fatti
- Imprese ungheresi detraggono; il Fisco nega adducendo irregolarità dell'emittente, senza provare il coinvolgimento dei cessionari
#### ❓ Questione
- Si può negare per le irregolarità dell'emittente senza provare la consapevolezza? Si può esigere che il cessionario verifichi il fornitore?
#### ⚖️ Soluzione
- **No** a entrambe: serve la prova oggettiva che il soggetto *sapeva o avrebbe dovuto sapere*
- Non si trasferiscono sul cessionario i compiti di controllo del fisco
- **Principio:** onere della prova sul fisco

### PPUH Stehcemp — C-277/14 (2015)
#### 📍 Fatti
- Acquisto di carburante da un fornitore poi qualificato «inesistente» (cancellato, privo di sede); detrazione negata
#### ❓ Questione
- La qualifica nazionale di «inesistente» priva il cessionario della detrazione?
#### ⚖️ Soluzione
- **No:** il fornitore resta soggetto passivo per criteri oggettivi (art. 9)
- Diniego solo con prova della consapevolezza dell'evasione
- **Principio:** la «inesistenza» del fornitore non basta

### Paper Consult — C-101/16 (2017)
#### 📍 Fatti
- Detrazione negata perché il fornitore è dichiarato «inattivo» (dichiarazione pubblica e online); diniego automatico nazionale
#### ❓ Questione
- È compatibile un diniego automatico fondato sull'inattività del fornitore?
#### ⚖️ Soluzione
- **No** se sistematico e definitivo, senza possibilità di provare l'assenza di evasione/perdita; sproporzionato
- **Principio:** niente automatismi

### Aquila Part Prod Com — C-512/21 (2022)
#### 📍 Fatti
- Sospetta frode «carosello» (settore alimentare); il Fisco nega rilevando l'inserimento in una catena di fatturazione circolare
#### ❓ Questione
- Basta la catena circolare per negare la detrazione? Quale diligenza è esigibile?
#### ⚖️ Soluzione
- Non basta: il Fisco deve **individuare con precisione** la frode e provare la partecipazione attiva o la consapevolezza, senza dover identificare tutti i partecipanti
- Diligenza **modulata** sulle circostanze
- **Principio:** standard probatorio rigoroso; la circolarità non prova la consapevolezza

### Ferimet — C-281/20 (2021) · *deroga*
#### 📍 Fatti
- In **reverse charge**, Ferimet indica **consapevolmente** un fornitore fittizio nell'autofattura
#### ❓ Questione
- Si può negare la detrazione a chi indica scientemente un fornitore inesistente?
#### ⚖️ Soluzione
- **Sì**, se ciò impedisce di verificare che il vero fornitore fosse soggetto passivo **oppure** se è provata l'evasione/consapevolezza
- Chi agisce così non può invocare la neutralità
- **Principio:** la mala fede esclude la tutela della neutralità

## 🔗 Raccordo con il rimborso

### Greentech — C-640/23 (2025)
#### 📍 Fatti
- Vendita **riqualificata** *ex post* come trasferimento d'azienda (fuori campo IVA); Greentech non può detrarre né correggere entro la prescrizione, né recuperare dal venditore
#### ❓ Questione
- Si può negare la detrazione dell'imposta non dovuta anche se il recupero presso il venditore è impossibile o eccessivamente difficile?
#### ⚖️ Soluzione
- Artt. 168 e 203 + neutralità/effettività **non ostano** al diniego
- Ma **esigono** che il soggetto possa rivolgere la domanda di rimborso **direttamente all'amministrazione** (logica *Reemtsma* → Modulo 3)
- **Principio:** niente detrazione sull'imposta non dovuta, ma rimedio diretto verso l'Erario
