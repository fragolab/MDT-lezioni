ne","children":[{"content":"L&apos;IVA non dovuta <strong>non</strong> &#xe8; rimborsabile ex 8&#xaa; direttiva; solo il <strong>prestatore</strong> &#xe8; debitore verso l&apos;Erario","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"Recupero presso il prestatore in via civilistica; ma se <strong>impossibile o eccessivamente difficile</strong> (insolvenza) &#x2192; azione <strong>diretta</strong> verso l&apos;Erario","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"<strong>Principio:</strong> regola bilaterale; eccezione = azione diretta (<em>extrema ratio</em>)","children":[],"payload":{"tag":"li","lines":"26,28"}}],"payload":{"tag":"h4","lines":"23,24"}}],"payload":{"tag":"h3","lines":"18,19"}},{"content":"Farkas &#x2014; C-564/15 (2017)","children":[{"content":"&#x1f4cd; Fatti","children":[{"content":"Acquisto a un&apos;asta soggetto a <strong>reverse charge</strong>, ma fatturato in regime ordinario con IVA; Farkas paga e detrae; il Fisco nega, esige il reverse charge e applica una sanzione del 50%","children":[],"payload":{"tag":"li","lines":"30,31"}}],"payload":{"tag":"h4","lines":"29,30"}},{"content":"&#x2753; Questione","children":[{"content":"Il cessionario pu&#xf2; detrarre l&apos;IVA erroneamente addebitata? Come recupera?","children":[],"payload":{"tag":"li","lines":"32,33"}}],"payload":{"tag":"h4","lines":"31,32"}},{"content":"&#x2696;&#xfe0f; Soluzione","children":[{"content":"<strong>Non</strong> pu&#xf2; detrarre l&apos;imposta non dovuta; recupera dal venditore","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"Se il recupero diviene <strong>impossibile o eccessivamente difficile</strong> (insolvenza) &#x2192; azione <strong>diretta</strong> verso l&apos;Erario","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"Sanzione del 50% sproporzionata","children":[],"payload":{"tag":"li","lines":"36,37"}},{"content":"<strong>Principio:</strong> la regola <em>Reemtsma</em> si estende al reverse charge erroneamente non applicato","children":[],"payload":{"tag":"li","lines":"37,39"}}],"payload":{"tag":"h4","lines":"33,34"}}],"payload":{"tag":"h3","lines":"28,29"}},{"content":"PORR &#xc9;p&#xed;t&#xe9;si &#x2014; C-691/17 (2019)","children":[{"content":"&#x1f4cd; Fatti","children":[{"content":"Operazione soggetta a reverse charge ma fatturata in regime ordinario; PORR detrae; il Fisco nega e accerta il reverse charge","children":[],"payload":{"tag":"li","lines":"41,42"}}],"payload":{"tag":"h4","lines":"40,41"}},{"content":"&#x2753; Questione","children":[{"content":"Si pu&#xf2; negare la detrazione senza prima verificare se l&apos;imposta indebita sia recuperabile?","children":[],"payload":{"tag":"li","lines":"43,44"}}],"payload":{"tag":"h4","lines":"42,43"}},{"content":"&#x2696;&#xfe0f; Soluzione","children":[{"content":"In assenza di sospetti di evasione, il Fisco non pu&#xf2; negare <strong>senza</strong> esaminare se l&apos;emittente possa rimborsare/rettificare, o senza rimborsare esso stesso il destinatario","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"Il rimedio diretto opera se il recupero presso il cedente &#xe8; impossibile/eccessivamente difficile","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"<strong>Principio:</strong> dovere istruttorio; il rimedio diretto <strong>non</strong> opera in caso di frode o abuso imputabili al cessionario","children":[],"payload":{"tag":"li","lines":"47,49"}}],"payload":{"tag":"h4","lines":"44,45"}}],"payload":{"tag":"h3","lines":"39,40"}}],"payload":{"tag":"h2","lines":"16,17"}},{"content":"&#x1f7ea; L&apos;evoluzione &#x2014; dalla prescrizione al consumatore finale","children":[{"content":"Sch&#xfc;tte &#x2014; C-453/22 (2023)","children":[{"content":"&#x1f4cd; Fatti","children":[{"content":"I fornitori di un agricoltore applicano un&apos;aliquota troppo elevata (19% anzich&#xe9; 7%); Sch&#xfc;tte detrae, il Fisco rettifica; il recupero presso i fornitori &#xe8; ormai <strong>prescritto</strong>","children":[],"payload":{"tag":"li","lines":"53,54"}}],"payload":{"tag":"h4","lines":"52,53"}},{"content":"&#x2753; Questione","children":[{"content":"Il rimedio diretto spetta anche quando il recupero bilaterale &#xe8; impossibile per <strong>prescrizione</strong>?","children":[],"payload":{"tag":"li","lines":"55,56"}}],"payload":{"tag":"h4","lines":"54,55"}},{"content":"&#x2696;&#xfe0f; Soluzione","children":[{"content":"<strong>S&#xec;:</strong> diritto al rimborso <strong>diretto</strong> verso l&apos;amministrazione <strong>+ interessi</strong>, quando &#x2014; senza frode, abuso o negligenza &#x2014; non si pu&#xf2; pi&#xf9; recuperare dai fornitori per prescrizione","children":[],"payload":{"tag":"li","lines":"57,58"}},{"content":"Interessi di mora se il rimborso non avviene entro un termine ragionevole","children":[],"payload":{"tag":"li","lines":"58,59"}},{"content":"<strong>Principio:</strong> il rimedio diretto copre anche la prescrizione; <em>dies a quo</em> mobile","children":[],"payload":{"tag":"li","lines":"59,61"}}],"payload":{"tag":"h4","lines":"56,57"}}],"payload":{"tag":"h3","lines":"51,52"}},{"content":"Osteopathie Van Hauwermeiren &#x2014; C-355/22 (2023)","children":[{"content":"&#x1f4cd; Fatti","children":[{"content":"Un giudice belga, dichiarata incompatibile una norma interna, vorrebbe <strong>mantenerne gli effetti</strong> per la difficolt&#xe0; di restituire l&apos;imposta ai numerosi clienti","children":[],"payload":{"tag":"li","lines":"63,64"}}],"payload":{"tag":"h4","lines":"62,63"}},{"content":"&#x2753; Questione","children":[{"content":"Il giudice nazionale pu&#xf2; mantenere gli effetti di una norma interna incompatibile per ragioni pratiche?","children":[],"payload":{"tag":"li","lines":"65,66"}}],"payload":{"tag":"h4","lines":"64,65"}},{"content":"&#x2696;&#xfe0f; Soluzione","children":[{"content":"<strong>No:</strong> non pu&#xf2; avvalersi di una norma interna che lo autorizzi a mantenere gli effetti di u
